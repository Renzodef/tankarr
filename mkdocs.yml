site_name: Tankarr
site_description: Self-hosted manga, manhwa and comics manager for the *arr stack. Monitors series, downloads chapters and volumes through Suwayomi, Prowlarr, qBittorrent and SABnzbd, and builds a clean CBZ library for Komga, Kavita and Stump.
site_url: https://renzodef.github.io/tankarr/
repo_url: https://github.com/Renzodef/tankarr
repo_name: Renzodef/tankarr
edit_uri: edit/main/docs/
copyright: Tankarr is free software released under the GPL-3.0 licence.

exclude_docs: |
  requirements.txt

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Renzodef/tankarr
      name: Tankarr on GitHub
    - icon: fontawesome/brands/docker
      link: https://github.com/Renzodef/tankarr/pkgs/container/tankarr
      name: Container image on GHCR

nav:
  - Home: index.md
  - Online demo: https://renzodef.github.io/tankarr/demo/
  - Screenshots: screenshots.md
  - Compared with other tools: comparison.md
  - Getting started:
      - Installation: installation.md
      - First steps: getting-started.md
      - Configuration reference: configuration.md
  - Using Tankarr:
      - How Tankarr works: how-it-works.md
      - Integrations: integrations.md
      - Operator workflows: operator-workflows.md
      - Translation fallback: translation.md
  - Operations:
      - Upgrading and release channels: upgrading.md
      - Operations and safety: operations-safety.md
      - Performance: performance.md
      - FAQ and troubleshooting: faq.md
  - Development:
      - Developing Tankarr: development.md
      - Releasing: releases.md
      - "Design: mixed series": design-mixed-series.md
