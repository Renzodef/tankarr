[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tankarr"
dynamic = ["version"]
description = "Self-hosted manga, manhwa and comics manager for the *arr stack: monitors series, downloads chapters and volumes, builds a clean CBZ library"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Vitoronzo De Francesco" }]
keywords = [
  "manga",
  "manhwa",
  "webtoon",
  "comics",
  "self-hosted",
  "arr",
  "sonarr",
  "suwayomi",
  "prowlarr",
  "komga",
  "kavita",
  "cbz",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "py3langid>=0.3,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/Renzodef/tankarr"
Documentation = "https://renzodef.github.io/tankarr/"
Source = "https://github.com/Renzodef/tankarr"
Issues = "https://github.com/Renzodef/tankarr/issues"
Changelog = "https://github.com/Renzodef/tankarr/releases"

[project.scripts]
tankarr = "tankarr.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "tankarr.__version__" }

[tool.setuptools.packages.find]
include = ["tankarr*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE"]
