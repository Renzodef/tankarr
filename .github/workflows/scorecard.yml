name: OpenSSF Scorecard

# Supply-chain health of this repository (pinned dependencies, branch
# protection, token permissions, ...), published to the Scorecard API for the
# badge in the README and to GitHub code scanning.
on:
  branch_protection_rule:
  schedule:
    - cron: "31 5 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish the results to the Scorecard API (public repositories only).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ !github.event.repository.private }}
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
