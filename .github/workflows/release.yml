name: Release

# A release is a signed-off tag vX.Y.Z on main whose version matches
# tankarr/__init__.py. The tag builds the images and publishes the notes.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          code_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' tankarr/__init__.py)"
          if [ "$version" != "$code_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tankarr.__version__ (${code_version})"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point at a commit on main"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  image:
    name: Image
    needs: verify
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      packages: write

  notes:
    name: Release notes
    needs: [verify, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; images are published."
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # The notes are the annotated tag's message, when there is one.
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          [ -s notes.md ] && printf '\n' >> notes.md
          printf 'Docker image: `%s:%s` (linux/amd64, linux/arm64)\n\nUpgrade notes: see the [upgrade guide](%s/%s/blob/%s/docs/upgrading.md).\n' \
            "$image" "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Tankarr ${TAG}" --notes-file notes.md --generate-notes "${flags[@]}"
