name: Docs

# The site carries the online demo at /demo/: the interface in front of a
# recording of the fictional library (build-demo.sh), so a change to the
# interface or to the API republishes it too.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "frontend/**"
      - "tankarr/**"
      - "tests/demo_snapshot.py"
      - "tests/demo_real.py"
      - "tests/browser_server.py"
      - "build-demo.sh"
      - "pyproject.toml"
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            pyproject.toml
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m mkdocs build --strict
      # Pull requests only check that the pages build; the demo is checked by
      # the Browser job of CI and published from main.
      - if: github.event_name != 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the online demo
        if: github.event_name != 'pull_request'
        env:
          TANKARR_PYTHON: python
          TANKARR_DEMO_DATASET: real
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          python -m pip install -e .
          npm ci --prefix frontend
          (cd frontend && npx playwright install --with-deps chromium)
          ./build-demo.sh
          cp -r frontend/dist-demo site/demo
      - if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    # GitHub Pages is free for public repositories only.
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
