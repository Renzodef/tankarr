name: Publish image

# any branch -> ghcr.io/<owner>/tankarr:branch-<name> and :sha-<commit>, to try a
#               change on a real installation before it is merged (docs/releases.md)
# vX.Y.Z     -> :X.Y.Z, :X.Y, :X (from 1.0.0 on), :latest and :sha-<commit>
#               (called by release.yml once the tag has been verified)
on:
  push:
    branches-ignore: [main, "dependabot/**"]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"
      - ".github/*.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading "v", for example 1.2.3
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-image-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DESCRIPTION: Self-hosted manga, manhwa and comics manager for the *arr stack. Monitors series, downloads chapters and volumes, builds a clean CBZ library.

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Name the image
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Tankarr
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.licenses=GPL-3.0-only
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: TANKARR_COMMIT=${{ github.sha }}
          # Supply-chain metadata alongside the image: a SLSA provenance
          # attestation and an SPDX SBOM, readable with `docker buildx
          # imagetools inspect <image> --format '{{ json .Provenance }}'`.
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=publish-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=publish-${{ env.PLATFORM_PAIR }},mode=max
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish tags
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Name the image
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,prefix=branch-,enable=${{ inputs.version == '' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' && !contains(inputs.version, '-') }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' && !contains(inputs.version, '-') && !startsWith(inputs.version, '0.') }}
            type=raw,value=latest,enable=${{ inputs.version != '' && !contains(inputs.version, '-') }}
      - name: Create the multi-architecture manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          args+=(--annotation "index:org.opencontainers.image.title=Tankarr")
          args+=(--annotation "index:org.opencontainers.image.description=${DESCRIPTION}")
          args+=(--annotation "index:org.opencontainers.image.source=${SOURCE}")
          args+=(--annotation "index:org.opencontainers.image.licenses=GPL-3.0-only")
          args+=(--annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}")
          for digest in *; do args+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"
      - name: Show the published image
        run: docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA::7}"
