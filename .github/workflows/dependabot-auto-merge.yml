name: Dependabot auto-merge

# Dependabot's pull requests are merged as soon as the required checks pass.
# Two exceptions are labelled needs-review and wait for a maintainer: a major
# update of a runtime dependency (judged per dependency, so a group is not
# held back by a major bump of a development tool) and base image changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  auto-merge:
    name: Merge when the checks pass
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide per dependency
        id: policy
        env:
          UPDATED: ${{ steps.metadata.outputs.updated-dependencies-json }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          # A group is merged automatically unless one of its members is a major
          # update of a runtime dependency; base image changes always wait.
          blocked="$(jq '[.[] | select(.updateType == "version-update:semver-major" and .dependencyType == "direct:production")] | length' <<< "$UPDATED")"
          if [ "$ECOSYSTEM" = "docker" ] || [ "$blocked" != "0" ]; then
            echo "decision=review" >> "$GITHUB_OUTPUT"
          else
            echo "decision=merge" >> "$GITHUB_OUTPUT"
          fi
      - name: Enable auto-merge
        if: steps.policy.outputs.decision == 'merge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # An already mergeable pull request cannot have auto-merge enabled:
          # merge it right away instead.
          gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
      - name: Leave it to a maintainer
        if: steps.policy.outputs.decision == 'review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh label create needs-review --repo "$GITHUB_REPOSITORY" --color e99695 --description "Waits for a maintainer" --force
          gh pr edit "$PR_URL" --add-label needs-review
