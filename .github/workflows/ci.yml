name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the OCR tools used by the integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check tankarr tests contrib
      - run: python -m ruff format --check tankarr tests contrib
      - run: python -m pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run i18n:check --prefix frontend
      - run: npm run build --prefix frontend

  deploy-files:
    name: Deployment files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the container entrypoint
        run: |
          sh -n docker-entrypoint.sh
          shellcheck docker-entrypoint.sh
      - name: Check the Unraid template
        run: python3 -c 'import sys, xml.etree.ElementTree as et; et.parse(sys.argv[1])' contrib/unraid/tankarr.xml
      - name: Lint and render the Helm chart
        run: |
          helm lint --strict contrib/helm/tankarr
          helm template tankarr contrib/helm/tankarr > /dev/null
          helm template tankarr contrib/helm/tankarr \
            --set ingress.enabled=true \
            --set serviceMonitor.enabled=true \
            --set serviceMonitor.apiKeySecret.name=tankarr-api-key \
            --set secretEnv.TANKARR_PROWLARR_API_KEY=fixture-key \
            --set persistence.import.enabled=true \
            --set persistence.import.existingClaim=media \
            --set persistence.library.existingClaim=comics \
            > /dev/null

  browser:
    name: Browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - name: Install Chromium for the browser tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test the production UI against an isolated real API
        run: npm run test:e2e --prefix frontend
      - name: Keep browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image without publishing it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tankarr:ci
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,scope=ci-amd64,mode=max
      - name: Smoke-test the image
        run: |
          wait_ready() {
            for attempt in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:$2/api/health"; then echo; return 0; fi
              if [ "$attempt" = 60 ]; then docker logs "$1"; return 1; fi
              sleep 2
            done
          }
          # Real uid:gid of the application (PID 1), whoever runs docker exec.
          process_ids() {
            docker exec "$1" awk '/^Uid:/ {u=$2} /^Gid:/ {g=$2} END {print u ":" g}' /proc/1/status
          }

          docker run -d --name tankarr-ci -p 127.0.0.1:8787:8787 tankarr:ci
          wait_ready tankarr-ci 8787
          # A fresh container must never be open: it creates a login instead.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/manga)" = 401
          docker logs tankarr-ci 2>&1 | grep -q "created one"
          # The entrypoint drops privileges: Tankarr itself never runs as root.
          test "$(process_ids tankarr-ci)" = 1000:1000
          docker exec tankarr-ci sh -c '
            for tool in bsdtar unar lsar tesseract pdfinfo pdftoppm java; do
              command -v "$tool" >/dev/null || { echo "missing $tool"; exit 1; }
            done
            tesseract --version | head -n 1
            java -version'
          docker rm -f tankarr-ci

          # PUID/PGID remap the user and hand it /config.
          docker run -d --name tankarr-puid -e PUID=1234 -e PGID=4321 \
            -p 127.0.0.1:8788:8787 tankarr:ci
          wait_ready tankarr-puid 8788
          test "$(process_ids tankarr-puid)" = 1234:4321
          test "$(docker exec tankarr-puid stat -c %u:%g /config)" = 1234:4321
          docker rm -f tankarr-puid

          # --user skips the remap: the container runs as that user directly.
          mkdir -p "$RUNNER_TEMP/tankarr-user/config" "$RUNNER_TEMP/tankarr-user/library"
          sudo chown -R 1001:100 "$RUNNER_TEMP/tankarr-user"
          docker run -d --name tankarr-user --user 1001:100 \
            -v "$RUNNER_TEMP/tankarr-user/config:/config" \
            -v "$RUNNER_TEMP/tankarr-user/library:/library" \
            -p 127.0.0.1:8789:8787 tankarr:ci
          wait_ready tankarr-user 8789
          test "$(process_ids tankarr-user)" = 1001:100
          docker rm -f tankarr-user
