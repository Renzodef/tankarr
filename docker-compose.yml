services:
  tankarr:
    # The published image. To build from this checkout instead, comment out
    # "image", uncomment "build" and run: docker compose up -d --build
    image: ghcr.io/renzodef/tankarr:${TANKARR_IMAGE_TAG:-latest}
    # build: .
    container_name: tankarr
    restart: unless-stopped
    environment:
      TANKARR_DATA_DIR: /config
      TANKARR_LIBRARY_DIR: /library
      TANKARR_IMPORT_DIR: /import
      TANKARR_DEFAULT_LANGUAGE: ${TANKARR_DEFAULT_LANGUAGE:-en}
      TANKARR_SEARCH_LANGUAGES: ${TANKARR_SEARCH_LANGUAGES:-en}
      TANKARR_TRANSLATION_ENABLED: ${TANKARR_TRANSLATION_ENABLED:-false}
      TANKARR_TRANSLATION_SOURCE_LANGUAGES: ${TANKARR_TRANSLATION_SOURCE_LANGUAGES:-original}
      TANKARR_TRANSLATION_PROCESSOR_URL: ${TANKARR_TRANSLATION_PROCESSOR_URL:-}
      TANKARR_TRANSLATION_PROCESSOR_TOKEN: ${TANKARR_TRANSLATION_PROCESSOR_TOKEN:-}
      TANKARR_TRANSLATION_AI_URL: ${TANKARR_TRANSLATION_AI_URL:-}
      TANKARR_TRANSLATION_AI_MODEL: ${TANKARR_TRANSLATION_AI_MODEL:-}
      TANKARR_TRANSLATION_AI_API_KEY: ${TANKARR_TRANSLATION_AI_API_KEY:-}
      TANKARR_MONITOR_ENABLED: ${TANKARR_MONITOR_ENABLED:-true}
      TANKARR_MONITOR_INTERVAL_SECONDS: ${TANKARR_MONITOR_INTERVAL_SECONDS:-900}
      TANKARR_WANTED_SEARCH_ENABLED: ${TANKARR_WANTED_SEARCH_ENABLED:-true}
      TANKARR_WANTED_SEARCH_INTERVAL_SECONDS: ${TANKARR_WANTED_SEARCH_INTERVAL_SECONDS:-21600}
      TANKARR_WANTED_SEARCH_BUDGET: ${TANKARR_WANTED_SEARCH_BUDGET:-25}
      TANKARR_OFFICIAL_EDITION_ALIGNMENT_ENABLED: ${TANKARR_OFFICIAL_EDITION_ALIGNMENT_ENABLED:-true}
      TANKARR_PAGE_QUALITY_RECOVERY_ENABLED: ${TANKARR_PAGE_QUALITY_RECOVERY_ENABLED:-true}
      TANKARR_DOWNLOAD_PIPELINE_MAX: ${TANKARR_DOWNLOAD_PIPELINE_MAX:-0}
      TANKARR_METADATA_ENABLED: ${TANKARR_METADATA_ENABLED:-true}
      TANKARR_METADATA_REFRESH_INTERVAL_HOURS: ${TANKARR_METADATA_REFRESH_INTERVAL_HOURS:-168}
      TANKARR_AUTHOR_REFRESH_INTERVAL_HOURS: ${TANKARR_AUTHOR_REFRESH_INTERVAL_HOURS:-24}
      TANKARR_SUWAYOMI_ENABLED: ${TANKARR_SUWAYOMI_ENABLED:-false}
      # managed: Tankarr runs its own Suwayomi server inside this container.
      # external: Tankarr connects to TANKARR_SUWAYOMI_URL.
      TANKARR_SUWAYOMI_MODE: ${TANKARR_SUWAYOMI_MODE:-managed}
      # Extension repository of the managed server (index URL); none by default.
      TANKARR_SUWAYOMI_EXTENSION_STORE: ${TANKARR_SUWAYOMI_EXTENSION_STORE:-}
      TANKARR_SUWAYOMI_URL: ${TANKARR_SUWAYOMI_URL:-http://suwayomi:4567}
      TANKARR_SUWAYOMI_USERNAME: ${TANKARR_SUWAYOMI_USERNAME:-}
      TANKARR_SUWAYOMI_PASSWORD: ${TANKARR_SUWAYOMI_PASSWORD:-}
      TANKARR_SUWAYOMI_LANGUAGE: ${TANKARR_SUWAYOMI_LANGUAGE:-en}
      TANKARR_SUWAYOMI_SOURCE_IDS: ${TANKARR_SUWAYOMI_SOURCE_IDS:-}
      TANKARR_SUWAYOMI_SEARCH_TIMEOUT_SECONDS: ${TANKARR_SUWAYOMI_SEARCH_TIMEOUT_SECONDS:-30}
      TANKARR_PROWLARR_ENABLED: ${TANKARR_PROWLARR_ENABLED:-false}
      TANKARR_PROWLARR_URL: ${TANKARR_PROWLARR_URL:-http://prowlarr:9696}
      TANKARR_PROWLARR_API_KEY: ${TANKARR_PROWLARR_API_KEY:-}
      TANKARR_PROWLARR_INDEXER_IDS: ${TANKARR_PROWLARR_INDEXER_IDS:-}
      TANKARR_PROWLARR_CATEGORIES: ${TANKARR_PROWLARR_CATEGORIES:-7000,7020,7030}
      TANKARR_INTERNET_ARCHIVE_ENABLED: ${TANKARR_INTERNET_ARCHIVE_ENABLED:-true}
      # qBittorrent and SABnzbd: internal service roots, for example
      # http://qbittorrent:8080 and http://sabnzbd:8080.
      TANKARR_QBITTORRENT_URL: ${TANKARR_QBITTORRENT_URL:-}
      TANKARR_QBITTORRENT_PUBLIC_URL: ${TANKARR_QBITTORRENT_PUBLIC_URL:-}
      TANKARR_QBITTORRENT_USERNAME: ${TANKARR_QBITTORRENT_USERNAME:-}
      TANKARR_QBITTORRENT_PASSWORD: ${TANKARR_QBITTORRENT_PASSWORD:-}
      TANKARR_QBITTORRENT_CATEGORY: ${TANKARR_QBITTORRENT_CATEGORY:-tankarr}
      TANKARR_QBITTORRENT_SAVE_PATH: ${TANKARR_QBITTORRENT_SAVE_PATH:-/data/downloads/tankarr}
      TANKARR_TORRENT_DOWNLOAD_DIR: /downloads
      TANKARR_TORRENT_AUTO_IMPORT: ${TANKARR_TORRENT_AUTO_IMPORT:-true}
      TANKARR_SABNZBD_URL: ${TANKARR_SABNZBD_URL:-}
      TANKARR_SABNZBD_PUBLIC_URL: ${TANKARR_SABNZBD_PUBLIC_URL:-}
      TANKARR_SABNZBD_API_KEY: ${TANKARR_SABNZBD_API_KEY:-}
      TANKARR_SABNZBD_CATEGORY: ${TANKARR_SABNZBD_CATEGORY:-tankarr}
      TANKARR_SABNZBD_COMPLETE_PATH: ${TANKARR_SABNZBD_COMPLETE_PATH:-/data/downloads/usenet}
      TANKARR_USENET_DOWNLOAD_DIR: /usenet
      TANKARR_AUTH_METHOD: ${TANKARR_AUTH_METHOD:-forms}
      TANKARR_AUTH_USERNAME: ${TANKARR_AUTH_USERNAME:-}
      TANKARR_AUTH_PASSWORD: ${TANKARR_AUTH_PASSWORD:-}
      TANKARR_READER_KIND: ${TANKARR_READER_KIND:-auto}
      TANKARR_READER_DISPLAY_MODE: ${TANKARR_READER_DISPLAY_MODE:-auto}
      TANKARR_KOMGA_LINK_ENABLED: ${TANKARR_KOMGA_LINK_ENABLED:-false}
      TANKARR_KOMGA_URL: ${TANKARR_KOMGA_URL:-}
      TANKARR_KOMGA_INTERNAL_URL: ${TANKARR_KOMGA_INTERNAL_URL:-}
      TANKARR_KOMGA_LIBRARY_ID: ${TANKARR_KOMGA_LIBRARY_ID:-}
      TANKARR_KOMGA_AUTH_METHOD: ${TANKARR_KOMGA_AUTH_METHOD:-auto}
      TANKARR_KOMGA_REFRESH_INTERVAL_MINUTES: ${TANKARR_KOMGA_REFRESH_INTERVAL_MINUTES:-360}
      TANKARR_KOMGA_API_KEY: ${TANKARR_KOMGA_API_KEY:-}
      TANKARR_KOMGA_USERNAME: ${TANKARR_KOMGA_USERNAME:-}
      TANKARR_KOMGA_PASSWORD: ${TANKARR_KOMGA_PASSWORD:-}
      TANKARR_NTFY_URL: ${TANKARR_NTFY_URL:-}
      TANKARR_NTFY_TOPIC: ${TANKARR_NTFY_TOPIC:-tankarr}
      TANKARR_NTFY_ON_CHAPTER_IMPORTED: ${TANKARR_NTFY_ON_CHAPTER_IMPORTED:-true}
      TANKARR_NTFY_ON_DOWNLOAD_FAILED: ${TANKARR_NTFY_ON_DOWNLOAD_FAILED:-true}
      TANKARR_NTFY_ON_DECISION_NEEDED: ${TANKARR_NTFY_ON_DECISION_NEEDED:-true}
      # Optional: keep backup bundles on a second disk, mounted at /backups
      # below. Without it they are written to /config/backups.
      # TANKARR_BACKUP_DIRECTORY: /backups
    volumes:
      - ${TANKARR_HOST_CONFIG_DIR:-./data}:/config
      - ${TANKARR_HOST_LIBRARY_DIR:-./data/library}:/library
      - ${TANKARR_HOST_IMPORT_DIR:-./data/import}:/import:ro
      - ${TANKARR_HOST_TORRENT_DIR:-./data/downloads/tankarr}:/downloads:ro
      # Optional: SABnzbd's completed folder, read by Tankarr to import Usenet
      # downloads. Only used once SABnzbd is configured.
      - ${TANKARR_HOST_USENET_DIR:-./data/downloads/usenet}:/usenet:ro
      # - /path/to/another/disk/tankarr-backups:/backups
    ports:
      - "${TANKARR_BIND_ADDRESS:-127.0.0.1}:${TANKARR_PORT:-8787}:8787"
      # Optional: the web interface of the managed Suwayomi server. It answers
      # outside the container only when Tankarr has a login, and uses it.
      # - "${TANKARR_BIND_ADDRESS:-127.0.0.1}:4567:4567"
