apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tankarr.fullname" . }}-test-connection
  labels:
    {{- include "tankarr.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: busybox:1.37
      command: ["wget"]
      args: ["-qO-", "http://{{ include "tankarr.fullname" . }}:{{ .Values.service.port }}/api/health"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
